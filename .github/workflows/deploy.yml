name: Validate and deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/auth_ci
      JWT_SECRET: isolated-ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment for this commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Configure RENDER_DEPLOY_HOOK_URL in repository Actions secrets."
            exit 1
          fi
          separator='?'
          case "$DEPLOY_HOOK" in *\?*) separator='&';; esac
          curl --fail --silent --show-error --output /dev/null "${DEPLOY_HOOK}${separator}ref=${COMMIT_SHA}"
